# =============================================================================
# Conductor Redis Sentinel Configuration (High Availability & Replication)
# =============================================================================

# Persistence & Queue backend
conductor.db.type=redis_sentinel
conductor.queue.type=redis_sentinel

# Sentinel host list: format is host1:port:rack;host2:port:rack;host3:port:rack
conductor.redis.hosts=redis-sentinel-1:26379:us-east-1c;redis-sentinel-2:26379:us-east-1c;redis-sentinel-3:26379:us-east-1c
conductor.redis.sentinelMasterName=mymaster
conductor.redis.availabilityZone=us-east-1c

# Key prefixes
conductor.redis.workflowNamespacePrefix=conductor
conductor.redis.queueNamespacePrefix=conductor_queues
conductor.redis.taskDefCacheRefreshInterval=1
conductor.redis.ssl=false

# Distributed Locking
conductor.workflow-execution-lock.type=local_only
conductor.app.workflowExecutionLockEnabled=true
conductor.app.lockTimeToTry=500

# Worker thread pools
conductor.app.systemTaskWorkerThreadCount=20
conductor.app.systemTaskMaxPollCount=20

# Indexing (Disabled by default for self-contained Redis deployment)
conductor.indexing.enabled=false

# Observability
conductor.metrics-prometheus.enabled=true
management.health.redis.enabled=true
