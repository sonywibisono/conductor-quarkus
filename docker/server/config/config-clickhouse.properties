# See README in the docker for configuration guide

# db.type determines the type of database used
# See various configurations below for the values

conductor.db.type=redis_standalone
conductor.queue.type=redis_standalone
conductor.indexing.enabled=true

conductor.indexing.type=clickhouse                                                                                        
conductor.clickhouse.url=${CLICKHOUSE_URL:-jdbc:clickhouse://host.docker.internal:8129/conductor?compress=0}
conductor.clickhouse.username=${CLICKHOUSE_USERNAME:-user_conductor}                                                                                     
conductor.clickhouse.password=${CLICKHOUSE_PASSWORD:-welcome1}
conductor.clickhouse.database=${CLICKHOUSE_DB:-conductor}
# =====================================================#
#              Redis Configuration Properties
# =====================================================#
# conductor.db.type=redis_standalone

# The last part MUST be us-east-1c, it is not used and is kept for backwards compatibility
conductor.redis-lock.server-type=SINGLE
conductor.redis.hosts=${REDIS_HOSTS:-conductor-redis:6379:us-east-1c}
conductor.redis.password=${REDIS_PASSWORD:-}
conductor.redis-lock.serverAddress=redis://${REDIS_HOSTS:-conductor-redis:6379:us-east-1c}
conductor.redis-lock.password=${REDIS_PASSWORD:-}
conductor.redis.taskDefCacheRefreshInterval=1
# conductor.workflow-execution-lock.type=redis         
conductor.workflow-execution-lock.type=noop_lock  
conductor.app.workflowExecutionLockEnabled=false                                                                   
conductor.redis.workflowNamespacePrefix=conductor
conductor.redis.queueNamespacePrefix=conductor_queues
# conductor.app.workflowExecutionLockEnabled=true
conductor.workflow-repair-service.enabled=false
conductor.app.workflow.name-validation.enabled=false
queues.dynomite.threads=20
conductor.redis.queuesNonQuorumPort=22122

conductor.task.poll.batch.size = 200
conductor.task.poll.interval = 60ms
task.executor.thread.count = 64
workflow.executor.thread.count = 1000
decider.thread.count = 100
queue.process.delay = 60ms

conductor.app.taskExecLogSizeLimit=10
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# Jangan langsung crash jika database lambat saat startup (opsional, default: 1)                                          
spring.datasource.hikari.initialization-fail-timeout=-1
                                                                                                                            
conductor.redis.time-between-eviction-runs-millis=10000
conductor.redis.max-wait-millis=20000


conductor.app.systemTaskWorkerThreadCount=200
conductor.app.systemTaskMaxPollCount=200

# For a single node dynomite or redis server, make sure the value below is set to same as rack specified in the "workflow.dynomite.cluster.hosts" property.
conductor.redis.availabilityZone=us-east-1c
conductor.redis.maxIdleConnections=128
conductor.redis.minIdleConnections=64
conductor.redis.minEvictableIdleTimeMillis = 1800000
conductor.redis.timeBetweenEvictionRunsMillis = -1L
conductor.redis.testWhileIdle = false
conductor.redis.numTestsPerEvictionRun = 3
conductor.redis.maxTimeoutWhenExhausted=2000ms
conductor.redis.workflowDefCacheEnabled=true


conductor.app.lockTimeToTry=500
conductor.app.sweeperThreadCount=20
# Percepat timeout offset workflow (default 30s)
conductor.app.sweeperWorkflowPollTimeout=10000
# Jumlah workflow yang diambil dalam 1 tarikan batch per thread (default: 2)
conductor.app.sweeper.sweepBatchSize=20    
    # Delay awal sebelum workflow baru dievaluasi oleh sweeper (default: 30s)
    # Nilai yang lebih tinggi memberi jarak antar evaluasi
conductor.app.workflowOffsetTimeout=5s
conductor.app.sweeper.queuePopTimeout=100

conductor.app.asyncIndexingEnabled=true
conductor.app.asyncUpdateShortRunningWorkflowDuration=30s
conductor.app.asyncUpdateDelay=60s


