# =====================================================#
#       Status Notifier Configuration Properties
# =====================================================#

# Task statuses to publish (comma-separated list)
# conductor.status-notifier.notification.subscribed-task-statuses=SCHEDULED,COMPLETED,FAILED,TIMED_OUT,IN_PROGRESS

# Workflow statuses to publish (comma-separated list)
# Valid values: RUNNING,COMPLETED,FAILED,TIMED_OUT,TERMINATED,PAUSED,RESUMED,RESTARTED,RETRIED,RERAN,FINALIZED
# conductor.status-notifier.notification.subscribed-workflow-statuses=RUNNING,COMPLETED,FAILED,TIMED_OUT,TERMINATED,PAUSED
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.health.redis.enabled=true
# Load sample kitchen sink workflow
loadSample=false

# Redis cluster connection in SSL mode
conductor.redis.ssl=false

# File storage
conductor.file-storage.enabled=true
conductor.file-storage.type=conductor